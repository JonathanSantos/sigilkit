name: Release

# Dispara ao empurrar uma tag vX.Y.Z (use scripts/version.mjs para o bump).
# Publica os quatro pacotes @sigilkit/* no npm com provenance e cria o
# GitHub Release. Exige o secret NPM_TOKEN (token granular com permissão de
# publish no escopo @sigilkit).

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # criar o GitHub Release
  id-token: write # provenance do npm

# releases nunca se cancelam no meio (publish parcial); enfileiram
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Tag deve bater com a versão dos quatro pacotes
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for p in core compiler cli test create; do
            V=$(node -p "require('./packages/$p/package.json').version")
            if [ "$V" != "$TAG" ]; then
              echo "::error::@sigilkit/$p está em $V, mas a tag é v$TAG — rode scripts/version.mjs"
              exit 1
            fi
          done

      # a mesma bateria do CI: build + exemplos + vitest, typecheck e o
      # guardião de manifesto stale
      - run: npm test
      - run: npm run typecheck:examples
      - name: sigil check nos exemplos
        run: |
          for dir in examples/*/; do
            node packages/cli/bin/sigil.js check "$dir"
          done

      - name: LICENSE em cada tarball
        run: for p in core compiler cli test create; do cp LICENSE "packages/$p/"; done

      # cli por último: depende de @sigilkit/compiler e @sigilkit/test.
      # IDEMPOTENTE: versão já publicada é pulada — um release que falhou no
      # meio pode ser re-emitido sem briga com o "cannot publish over".
      # Tokens separados: NPM_TOKEN é granular no escopo @sigilkit;
      # create-sigil (sem escopo) usa o NPM_CREATE_SIGIL_TOKEN.
      - name: Publicar @sigilkit/* no npm (com provenance)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for w in "@sigilkit/core:core" "@sigilkit/compiler:compiler" "@sigilkit/test:test" "@sigilkit/cli:cli"; do
            name="${w%%:*}"; dir="${w##*:}"
            V=$(node -p "require('./packages/$dir/package.json').version")
            if npm view "$name@$V" version >/dev/null 2>&1; then
              echo "↷ $name@$V já publicado — pulando"
            else
              npm publish --workspace "$name" --provenance --access public
            fi
          done

      - name: Publicar create-sigil no npm (com provenance)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_CREATE_SIGIL_TOKEN }}
        run: |
          V=$(node -p "require('./packages/create/package.json').version")
          if npm view "create-sigil@$V" version >/dev/null 2>&1; then
            echo "↷ create-sigil@$V já publicado — pulando"
          else
            npm publish --workspace create-sigil --provenance --access public
          fi

      # idempotente como o publish: re-run de release parcial não briga
      # com um GitHub Release que já existe
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --generate-notes

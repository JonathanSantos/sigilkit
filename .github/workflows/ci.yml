name: CI

# push só na main — PRs cobrem as branches, e tags são cobertas pelo Release,
# que roda a mesma bateria. Sem isso, um release custava 3 pipelines: CI do
# push + CI da tag + Release.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# pushes em sequência cancelam o run anterior do mesmo ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # matrix: linux + mac obrigatórios; repo público = minutos gratuitos
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # sem timeout o default do GitHub é 6h — um run travado queima a cota
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # build dos pacotes + sigil build/bundle nos exemplos + vitest
      # (inclui teste de fronteira R1/R2, snapshots de IR/emitters,
      #  diagnósticos com caret, simulador @sigilkit/test e E2E do CLI)
      - run: npm test
      - run: npm run typecheck:examples
      # o guardião do manifesto: falha se alguém commitou manifesto stale
      - run: |
          for dir in examples/*/; do
            node packages/cli/bin/sigil.js check "$dir"
          done

  # Windows é EXPERIMENTAL: não bloqueia o merge enquanto a suíte não for
  # 100% portável (paths, spawn) — o job existe para medirmos a distância.
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  e2e-electron:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # o VSCode baixado pelo @vscode/test-electron (~150 MB) fica em cache;
      # a chave segue o lock (bump do test-electron renova o cache)
      - uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: vscode-test-${{ runner.os }}-
      - run: npm ci
      # caminho feliz no extension host real (xvfb para o Electron headless)
      - run: xvfb-run -a npm run test:e2e

name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # build dos pacotes + sigil build no exemplo + bundle + vitest
      # (inclui teste de fronteira R1/R2, snapshots de IR/emitters,
      #  diagnósticos com caret, simulador @sigil/test e E2E do CLI)
      - run: npm test
      # o guardião do manifesto: falha se alguém commitou manifesto stale
      - run: node packages/cli/bin/sigil.js check examples/hello

  e2e-electron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # caminho feliz no extension host real (xvfb para o Electron headless)
      - run: xvfb-run -a npm run test:e2e
